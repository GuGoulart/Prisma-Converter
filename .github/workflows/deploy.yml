name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixando Código
        uses: actions/checkout@v4

      - name: 🔐 Autenticando no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: ⚙️ Configurando SDK do Google
        uses: google-github-actions/setup-gcloud@v2

      - name: 🚀 Lançando para o Cloud Run
        run: |
          # Monta a lista de env vars dinamicamente.
          # REDIS_URL e GCS_BUCKET são opcionais — se não definidos nos Secrets,
          # o app usa modo in-memory/local automaticamente (sem quebrar).
          ENV_VARS="SECRET_KEY=${{ secrets.SECRET_KEY }}"

          if [ -n "${{ secrets.REDIS_URL }}" ]; then
            ENV_VARS="${ENV_VARS},REDIS_URL=${{ secrets.REDIS_URL }}"
          fi

          if [ -n "${{ secrets.GCS_BUCKET }}" ]; then
            ENV_VARS="${ENV_VARS},GCS_BUCKET=${{ secrets.GCS_BUCKET }}"
          fi

          if [ -n "${{ secrets.GCS_PREFIX }}" ]; then
            ENV_VARS="${ENV_VARS},GCS_PREFIX=${{ secrets.GCS_PREFIX }}"
          fi

          gcloud run deploy prisma \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 2Gi \
            --set-env-vars="${ENV_VARS}" \
            --quiet
